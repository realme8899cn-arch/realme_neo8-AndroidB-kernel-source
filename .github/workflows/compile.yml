name: Build Realme Neo 8 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm

      - name: Download Google Clang
        run: |
          A_BASE="https://android."
          A_PATH="://googlesource.com"
          FINAL_URL="${A_BASE}${A_PATH}"
          mkdir clang && cd clang
          curl -Lo clang.tar.gz "$FINAL_URL"
          tar -xzf clang.tar.gz && rm -f clang.tar.gz

      - name: Compiling Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make O=out gki_defconfig
          make -j$(nproc) O=out CC=clang
          
